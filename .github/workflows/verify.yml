name: Verify fixtures

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify image and license integrity
        run: python3 scripts/verify.py
      - name: Verify release packaging
        run: python3 scripts/build.py --package-only
